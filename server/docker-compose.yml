# The RIM lobby server behind Caddy, which obtains and renews the TLS certificate for the domain by itself.
# On the VPS, in /opt/rim-server:  docker compose up -d --build     (the GitHub workflow runs exactly that)
name: rim-server

x-logging: &logging # keep container logs from filling the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lobby:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
    expose:
      - "8787" # reachable by Caddy only, never published on the host
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - lobby
    ports:
      - "80:80" # ACME HTTP challenge + redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account: keep them
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
