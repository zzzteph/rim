name: Lobby server image

# Tests the multiplayer server (server/), exports the web game into it, then builds the Docker image and publishes it to
# the GitHub Container Registry as ghcr.io/<owner>/rim-lobby — tags :latest (main only) and :sha-<commit> — for
# linux/amd64 and linux/arm64. One container serves the game at / and the lobby at /ws, so the game and its server
# always have the same version. The VPS runs it with plain docker commands (server/README.md → "Deploy").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobby-server-image
  cancel-in-progress: false

env:
  # Must be a version whose Linux editor AND export templates are on github.com/godotengine/godot-builds/releases.
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to ghcr.io with the workflow's own token: no extra secret
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-web

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip && mkdir -p ~/godot-bin && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d _tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T" && mv _tpz/templates/web_* _tpz/templates/version.txt "$T/"   # only what a Web export needs
          rm -rf _tpz templates.tpz godot.zip

      - name: Export the web game into server/public
        run: |
          set -euo pipefail
          chmod +x ~/godot-bin/godot
          timeout 300 ~/godot-bin/godot --headless --path . --import || true   # builds the resource cache
          ~/godot-bin/godot --headless --path . --export-release "Web" server/public/index.html
          test -f server/public/index.html && test -f server/public/index.wasm && test -f server/public/index.pck
          gzip -9 -k server/public/*.wasm server/public/*.pck server/public/*.js server/public/*.html   # served to browsers that take gzip
          ls -la server/public

      - name: Image name (GHCR wants it in lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rim-lobby" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.4.0      # arm64 builds on the amd64 runner
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=rim-lobby
            org.opencontainers.image.description=RIM web game and multiplayer lobby server

      - uses: docker/build-push-action@v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
